spring:

  sql:
    init:
      mode: never

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  test:
    database:
      replace: none

  task:
    scheduling:
      enabled: false