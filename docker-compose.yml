version: "3.9"

services:
  copi:
    container_name: copi
    build:
      context: .
      dockerfile: Dockerfile
    image: copi:latest

    ports:
      - "8092:8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod

      # Admin
      COPI_ADMIN_PASSWORD: copi

      # Master crypto key
      MASTER_KEY: change-this-secret-key

      # Server port
      SERVER_PORT: 8080

      # Session timeout
      SESSION_TIMEOUT: 30

      # Create files with strict permissions
      UMASK: "077"

      # Target uid/gid for mounted folders (used by entrypoint)
      PUID: "99"
      PGID: "100"

      # SQLite
      SPRING_DATASOURCE_URL: jdbc:sqlite:/config/copi.db
      SPRING_DATASOURCE_DRIVER: org.sqlite.JDBC

      # Backup directory
      APP_BACKUP_DIR: /app/backups

      # Dump tools paths
      MYSQLDUMP_PATH: mysqldump
      MARIADUMP_PATH: mariadb-dump
      PGDUMP_PATH: pg_dump
      PGDUMPALL_PATH: pg_dumpall
      MONGODUMP_PATH: mongodump

    volumes:
      # SQLite database persisted on host
      - ./config:/config

      # Backups persisted in docker volume
      - copi_backups:/app/backups

    restart: unless-stopped

volumes:
  copi_backups:
