services:
  copi:
    container_name: copi
    build:
      context: .
      dockerfile: Dockerfile
      args:
        POSTGRES_CLIENT_MAJOR: ${POSTGRES_CLIENT_MAJOR:-16}
    image: copi:latest

    ports:
      - "${COPI_HTTP_PORT:-8092}:${SERVER_PORT:-8080}"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      # Admin
      COPI_ADMIN_PASSWORD: "${COPI_ADMIN_PASSWORD:?Set COPI_ADMIN_PASSWORD in .env}"

      # Master crypto key
      MASTER_KEY: "${MASTER_KEY:?Set MASTER_KEY in .env}"

      # Server port
      SERVER_PORT: ${SERVER_PORT:-8080}

      # Session timeout
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30}

      # Create files with strict permissions
      UMASK: "${UMASK:-077}"

      # Target uid/gid for mounted folders (used by entrypoint)
      PUID: "${PUID:-99}"
      PGID: "${PGID:-100}"

      # SQLite
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:sqlite:/config/copi.db}
      SPRING_DATASOURCE_DRIVER: ${SPRING_DATASOURCE_DRIVER:-org.sqlite.JDBC}

      # Backup directory
      APP_BACKUP_DIR: ${APP_BACKUP_DIR:-/app/backups}

      # Dump tools paths
      MYSQLDUMP_PATH: ${MYSQLDUMP_PATH:-mysql-mysqldump}
      MARIADUMP_PATH: ${MARIADUMP_PATH:-mariadb-dump}
      PGDUMP_PATH: ${PGDUMP_PATH:-postgresql-pg-dump}
      PGDUMPALL_PATH: ${PGDUMPALL_PATH:-postgresql-pg-dumpall}
      MONGODUMP_PATH: ${MONGODUMP_PATH:-mongodump}

    volumes:
      # SQLite database persisted on host
      - ./backend/config:/config

      # Backups persisted in docker volume
      - "copi_backups:${APP_BACKUP_DIR:-/app/backups}"

    restart: unless-stopped

volumes:
  copi_backups:

